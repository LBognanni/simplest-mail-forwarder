name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

env:
  IMAGE: simplest-mail-forwarder:test

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --no-cache --pull -t "$IMAGE" .

      - name: Smoke test
        run: test/smoke.sh

      - name: Save image
        run: docker save -o test/image.tar "$IMAGE"

      - name: Scan
        run: docker compose -f test/compose.yml --profile scan run --rm trivy

      - name: Keep image for publishing
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: test/image.tar
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Set image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          docker load -i image.tar
          version="$(date -u +%F).$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          docker tag "$IMAGE" "$REGISTRY_IMAGE:$version"
          docker tag "$IMAGE" "$REGISTRY_IMAGE:latest"
          docker push "$REGISTRY_IMAGE:$version"
          docker push "$REGISTRY_IMAGE:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:latest")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create release
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes "Image: \`$REGISTRY_IMAGE:$VERSION\`

          Digest: \`$DIGEST\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.push.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Summary
        run: echo "Published \`$REGISTRY_IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
